name: CI

# Runs on every push to main and by hand; publishing is publish.yml, on a version tag.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel in-progress runs for the same branch to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
